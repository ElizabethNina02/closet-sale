# URL configurada específicamente para SQL Server Express
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=closet-sale;encrypt=true;trustServerCertificate=true

spring.datasource.username=sa
spring.datasource.password=12345

# Driver y configuración de Hibernate que agregamos antes
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.application.name=closet-sale
server.port=8080
# Configuración de Llaves Asimétricas RSA para JWT
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem


# Obliga a Spring Boot a ejecutar el script data.sql siempre al iniciar
spring.sql.init.mode=always

# Asegura que el script se ejecute DESPUÉS de que Hibernate verifique o cree las tablas
spring.jpa.defer-datasource-initialization=true

spring.sql.init.separator=GO

# Evita que falle si los datos ya existen (como tu IF NOT EXISTS)
spring.sql.init.continue-on-error=true 