

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fake_db}
spring.datasource.username=${DB_USERNAME:fake_user}
spring.datasource.password=${DB_PASSWORD:fake_password}

# Forzar el dialecto directamente en Spring Boot 4 / Hibernate 6+
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Configuración General del Proyecto
spring.application.name=closet-sale
server.port=8080

# Configuración de Llaves Asimétricas RSA para JWT
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# Inicialización de Datos (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.separator=GO
spring.sql.init.continue-on-error=true
